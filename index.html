<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Sala</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2d1b69;--ink:#fff;--card:#fff;--cardink:#2b2340;--r:#e5304f;--b:#2a6fdb;--y:#f2b01e;--g:#26a05a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1038;--card:#2b2150;--cardink:#f3efff}}
:root[data-theme="dark"]{--bg:#1a1038;--card:#2b2150;--cardink:#f3efff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Baloo 2",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:20px 16px 32px;min-height:100vh;display:flex;flex-direction:column;gap:14px}
h1{font-size:clamp(2.2rem,9vw,3.6rem);line-height:1;margin:5vh 0 0;font-weight:800}
h2{margin:0;font-size:1.4rem}
p{margin:0;font-size:1.1rem;opacity:.92}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:2px}
input[type=text],input:not([type]),input[type=number],textarea{width:100%;padding:12px 14px;border-radius:10px;border:0;background:var(--card);color:var(--cardink);font-size:1.1rem}
label{display:flex;flex-direction:column;gap:4px;font-weight:700}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row input{flex:1}
.go{background:var(--y);color:#2b2340;font-weight:800;font-size:1.3rem;padding:12px 24px;border-radius:12px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.go.sm{font-size:1rem;padding:8px 16px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.ghost{background:rgba(255,255,255,.18);padding:8px 14px;border-radius:10px;font-weight:700}
.warn{background:var(--r);padding:10px 14px;border-radius:10px;font-weight:700}
.item{background:var(--card);color:var(--cardink);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.1rem}
.bar{height:10px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--y);transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.q{background:var(--card);color:var(--cardink);border-radius:14px;padding:24px 18px;font-size:clamp(1.3rem,4.5vw,1.9rem);font-weight:700;text-align:center;min-height:110px;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.o{padding:20px 14px;border-radius:12px;font-size:1.2rem;font-weight:700;text-align:left;display:flex;gap:10px;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.3);min-height:80px}
.o b{font-size:1.5rem}
.c0{background:var(--r)}.c1{background:var(--b)}.c2{background:var(--y);color:#2b2340}.c3{background:var(--g)}
.o.dim{opacity:.35}.o.right{outline:4px solid #fff}
.pin{font-size:clamp(3rem,16vw,6rem);font-weight:800;letter-spacing:.08em;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:rgba(255,255,255,.18);padding:6px 12px;border-radius:20px;font-weight:700}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{background:var(--card);color:var(--cardink);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;font-weight:700}
.big{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;text-align:center}
.qe{background:rgba(255,255,255,.1);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.oe{display:flex;gap:8px;align-items:center}
.oe input[type=radio]{width:22px;height:22px;accent-color:var(--y)}
.oe .dot{width:14px;height:34px;border-radius:5px}
.hint{font-size:.95rem;opacity:.8}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,getDoc,setDoc,updateDoc,addDoc,getDocs,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const TIME=20,SYM="▲◆●■";
const SAMPLE={id:"_ex",title:"Exemplo: conhecimentos gerais",questions:[
{q:"Qual é o maior planeta do Sistema Solar?",o:["Marte","Júpiter","Saturno","Terra"],a:1},
{q:"Quem pintou a Mona Lisa?",o:["Van Gogh","Picasso","Da Vinci","Monet"],a:2},
{q:"Quantos estados tem o Brasil?",o:["24","26","27","28"],a:1},
{q:"Qual é o resultado de 7 × 8?",o:["54","56","58","64"],a:1},
{q:"Qual gás as plantas absorvem na fotossíntese?",o:["Oxigênio","Nitrogênio","Hélio","Gás carbônico"],a:3}]};
const $=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const set=h=>{$.innerHTML=h};
const $$=id=>document.getElementById(id);
let db=null,uid=null,name="",screen="home",gid=null,G=null,P=[],A=[],isHost=false,unsubs=[],lastKey="",t0=0,mine=null,scored="",myScore=0,hostTimer=null;

// ====== COLE AQUI A CONFIGURAÇÃO DO SEU PROJETO FIREBASE ======
const firebaseConfig={
 apiKey:"COLE_AQUI",
 authDomain:"COLE_AQUI",
 projectId:"COLE_AQUI",
 appId:"COLE_AQUI"
};
// ===============================================================
(async()=>{
 try{name=localStorage.getItem("qn")||""}catch(e){}
 if(firebaseConfig.apiKey!=="COLE_AQUI"){
  try{
   const app=initializeApp(firebaseConfig),auth=getAuth(app),f=getFirestore(app);
   const cred=await signInAnonymously(auth);uid=cred.user.uid;
   const ds=s=>({exists:s.exists(),data:()=>s.data()});
   db={
    doc:p=>{const r=doc(f,p);return{get:async()=>ds(await getDoc(r)),set:d=>setDoc(r,d),update:d=>updateDoc(r,d),onSnapshot:fn=>onSnapshot(r,x=>fn(ds(x)))}},
    collection:p=>{const r=collection(f,p);return{get:()=>getDocs(r),add:d=>addDoc(r,d),onSnapshot:fn=>onSnapshot(r,fn)}}
   };
  }catch(e){db=null;console.error(e)}
 }
 home();
})();

function leave(){unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];clearTimeout(hostTimer);G=null;P=[];A=[];gid=null;lastKey="";mine=null;myScore=0;scored=""}
function readName(){const v=($$("nm")?.value||"").trim();if(!v){$$("nm")?.focus();return null}name=v;try{localStorage.setItem("qn",v)}catch(e){}return v}

async function home(){
 leave();screen="home";
 set(`<h1>Quiz Sala</h1>
 ${db?"":`<p class="warn">Firebase não configurado. Cole a configuração do projeto no início do código (veja o passo a passo).</p>`}
 <label>Seu nome<input id="nm" maxlength="20" value="${esc(name)}"></label>
 <div class="row"><input id="pin" inputmode="numeric" maxlength="5" placeholder="PIN do jogo"><button class="go" id="j">Entrar</button></div>
 <p id="err" class="hint"></p>
 <div class="row"><h2>Quizzes</h2><button class="go sm" id="new">Criar quiz</button></div>
 <div id="list"><p>Carregando…</p></div>`);
 $$("new").onclick=()=>{readName()&&editor()};
 $$("j").onclick=()=>{const p=$$("pin").value.trim();if(readName()&&p)join(p)};
 let Q=[SAMPLE];
 const draw=()=>{const l=$$("list");if(!l)return;l.innerHTML=Q.map((q,i)=>`<div class="item"><span>${esc(q.title)}<br><small>${q.questions.length} perguntas</small></span><button class="go sm" data-i="${i}">Hospedar</button></div>`).join("");
  l.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(readName())host(Q[+b.dataset.i])})};
 draw();
 if(db){try{const s=await db.collection("quizzes").get();Q=[SAMPLE,...s.docs.map(d=>({id:d.id,...d.data()}))];draw()}catch(e){}}
}

function editor(){
 screen="editor";
 let qs=[{q:"",o:["","","",""],a:0}],title="";
 const collect=()=>{title=$$("ti").value;qs=[...document.querySelectorAll(".qe")].map((e,n)=>({q:e.querySelector(".qt").value,o:[...e.querySelectorAll(".ot")].map(i=>i.value),a:+(e.querySelector("input[type=radio]:checked")?.value??0)}))};
 const draw=()=>{set(`<div class="row"><h1 style="margin:0;font-size:2rem">Criar quiz</h1><button class="ghost" id="back">Voltar</button></div>
  <label>Título do quiz<input id="ti" maxlength="60" value="${esc(title)}"></label>
  ${qs.map((x,n)=>`<div class="qe"><div class="row"><b>Pergunta ${n+1}</b>${qs.length>1?`<button class="ghost rm" data-n="${n}">Remover</button>`:""}</div>
   <input class="qt" maxlength="160" placeholder="Digite a pergunta" value="${esc(x.q)}">
   ${x.o.map((o,k)=>`<div class="oe"><span class="dot c${k}"></span><input class="ot" maxlength="80" placeholder="Opção ${k+1}" value="${esc(o)}"><input type="radio" name="a${n}" value="${k}" ${x.a===k?"checked":""} aria-label="Resposta correta ${k+1}"></div>`).join("")}
   <span class="hint">Marque o círculo da resposta correta.</span></div>`).join("")}
  <div class="row"><button class="ghost" id="add">Adicionar pergunta</button><button class="go" id="save">Salvar quiz</button></div>
  <p id="err" class="hint"></p>`);
  $$("back").onclick=home;
  $$("add").onclick=()=>{collect();qs.push({q:"",o:["","","",""],a:0});draw()};
  document.querySelectorAll(".rm").forEach(b=>b.onclick=()=>{collect();qs.splice(+b.dataset.n,1);draw()});
  $$("save").onclick=async()=>{collect();
   if(!title.trim()||qs.some(x=>!x.q.trim()||x.o.some(o=>!o.trim()))){$$("err").textContent="Preencha o título, todas as perguntas e todas as opções.";return}
   if(!db){$$("err").textContent="Firebase não configurado.";return}
   try{await db.collection("quizzes").add({title:title.trim(),questions:qs,by:name});home()}catch(e){$$("err").textContent="Não foi possível salvar. Tente de novo."}}};
 draw();
}

async function host(quiz){
 if(!db){return}
 let pin;for(let i=0;i<5;i++){pin=String(Math.floor(10000+Math.random()*90000));const s=await db.doc("games/"+pin).get();if(!s.exists)break}
 leave();gid=pin;isHost=true;screen="game";
 await db.doc("games/"+pin).set({title:quiz.title,questions:quiz.questions,host:uid,status:"lobby",qi:0});
 sub();render();
}
async function join(pin){
 if(!db){$$("err").textContent="Firebase não configurado.";return}
 try{const s=await db.doc("games/"+pin).get();
  if(!s.exists){$$("err").textContent="PIN não encontrado. Confira o número na tela do anfitrião.";return}
  if(s.data().status!=="lobby"){$$("err").textContent="Esse jogo já começou.";return}
  leave();gid=pin;isHost=false;screen="game";
  await db.doc(`games/${pin}/players/${uid}`).set({name,score:0});
  sub();render();
 }catch(e){$$("err").textContent="Não foi possível entrar. Tente de novo."}
}
function sub(){
 const g=gid;
 unsubs=[db.doc("games/"+g).onSnapshot(s=>{G=s.exists?s.data():null;render()}),
  db.collection(`games/${g}/players`).onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));render()})];
 if(isHost)unsubs.push(db.collection(`games/${g}/answers`).onSnapshot(s=>{A=s.docs.map(d=>d.data());if(G&&G.status==="question"&&P.length&&A.filter(a=>a.qi===G.qi).length>=P.length)reveal();upd()}));
}
const upd=()=>{const c=$$("cnt");if(c&&G)c.textContent=`${A.filter(a=>a.qi===G.qi).length} de ${P.length} responderam`};
const setG=d=>db.doc("games/"+gid).update(d);
const reveal=()=>{clearTimeout(hostTimer);if(G&&G.status==="question")setG({status:"reveal"})};
const sorted=()=>[...P].sort((a,b)=>(b.score||0)-(a.score||0));
const lb=n=>`<ol class="lb">${sorted().slice(0,n).map((p,i)=>`<li><span>${i+1}. ${esc(p.name)}${p.id===uid?" (você)":""}</span><b>${p.score||0}</b></li>`).join("")}</ol>`;
const opts=(Q,cls)=>`<div class="opts">${Q.o.map((x,k)=>`<${cls==="btn"?"button":"div"} class="o c${k} ${cls==="btn"?"":(k===Q.a?"right":"dim")}" data-k="${k}"><b>${SYM[k]}</b>${esc(x)}</${cls==="btn"?"button":"div"}>`).join("")}</div>`;

function render(){
 if(screen!=="game")return;
 if(!G){set(`<h1>Conectando…</h1>`);return}
 const key=G.status+G.qi;
 if(G.status==="question"&&key===lastKey){upd();return}
 lastKey=key;
 const Q=G.questions[G.qi],n=G.questions.length;
 const exit=`<button class="ghost" id="exit">Sair</button>`;
 if(G.status==="lobby"){
  set(`<div class="row"><h2>${esc(G.title)}</h2>${exit}</div>
  ${isHost?`<p>Peça para todos abrirem este link e entrarem com o PIN:</p><div class="pin">${gid}</div>`:`<h1>Você está dentro!</h1><p>Aguarde o anfitrião iniciar o jogo.</p>`}
  <div class="chips">${P.map(p=>`<span>${esc(p.name)}</span>`).join("")||"<p>Ninguém entrou ainda.</p>"}</div>
  ${isHost?`<button class="go" id="start" ${P.length?"":"disabled"}>Iniciar (${P.length} jogadores)</button>`:""}`);
  if(isHost)$$("start").onclick=()=>setG({status:"question",qi:0});
 }
 else if(G.status==="question"){
  t0=Date.now();mine=null;
  if(isHost){clearTimeout(hostTimer);hostTimer=setTimeout(reveal,TIME*1000+400)}
  set(`<div class="top"><span>Pergunta ${G.qi+1} de ${n}</span>${exit}</div>
  <div class="bar"><i style="animation-duration:${TIME}s"></i></div>
  <div class="q">${esc(Q.q)}</div>
  ${isHost?opts({...Q,a:-1},"host").replace(/ dim/g,"")+`<div class="row"><p id="cnt"></p><button class="ghost" id="skip">Encerrar rodada</button></div>`:opts(Q,"btn")}`);
  if(isHost){$$("skip").onclick=reveal;upd()}
  else document.querySelectorAll(".o").forEach(b=>b.onclick=()=>answer(+b.dataset.k,Q));
 }
 else if(G.status==="reveal"){
  let pts=0;
  if(mine&&mine.k===Q.a)pts=Math.round(500+500*Math.max(0,1-mine.ms/(TIME*1000)));
  if(!isHost&&scored!==gid+G.qi){scored=gid+G.qi;myScore+=pts;db.doc(`games/${gid}/players/${uid}`).update({score:myScore})}
  const counts=Q.o.map((_,k)=>A.filter(a=>a.qi===G.qi&&a.k===k).length);
  set(`<div class="top"><span>Pergunta ${G.qi+1} de ${n}</span>${exit}</div>
  <div class="q">${esc(Q.q)}</div>
  ${opts(Q,"show").replace(/<\/b>/g,(m)=>m)}
  ${isHost?`<p>Respostas: ${Q.o.map((o,k)=>`${SYM[k]} ${counts[k]}`).join("   ")}</p>`:`<div class="big">${pts?`Correto! +${pts}`:(mine?"Não foi dessa vez":"Sem resposta")}</div>`}
  <h2>Ranking</h2>${lb(5)}
  ${isHost?`<button class="go" id="next">${G.qi+1>=n?"Ver resultado final":"Próxima pergunta"}</button>`:""}`);
  if(isHost)$$("next").onclick=()=>G.qi+1>=n?setG({status:"end"}):setG({status:"question",qi:G.qi+1});
 }
 else{
  set(`<h1>Fim de jogo</h1><h2>Ranking final</h2>${lb(10)}<button class="go" id="exit">Voltar ao início</button>`);
 }
 const ex=$$("exit");if(ex)ex.onclick=home;
}
async function answer(k,Q){
 if(mine)return;
 mine={k,ms:Date.now()-t0};
 set(`<div class="top"><span>Pergunta ${G.qi+1}</span></div><div class="big">Resposta enviada ${SYM[k]}</div><p style="text-align:center">Aguarde o resultado da rodada.</p>`);
 try{await db.doc(`games/${gid}/answers/${G.qi}_${uid}`).set({qi:G.qi,uid,k,ms:mine.ms})}catch(e){}
}
</script>
</body>
</html>
